# Based off of George Hotz config:
# https://github.com/geohot/configuration/blob/9795313/.tmux.conf

unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
# Keep copy-mode (and scroll position) after selecting text with the mouse
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left '#[fg=colour231,bg=colour31,bold]#( [ -n "$SSH_CONNECTION" ] && echo " SSH " )'
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g mode-keys vi

setw -g window-status-current-format ' #I#[fg=blue]:#[fg=white]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

set-option -g history-limit 50000
set-option -g renumber-windows on

# tmux-256color gives proper 256-color/italic/feature support (vs the legacy
# screen-256color). Requires the terminfo entry, which exists on this system.
set -g default-terminal "tmux-256color"

# Let apps use true color and tell tmux the outer kitty terminal can receive
# extended keys, so Shift+Enter / Ctrl+Enter (e.g. in Claude Code) pass through.
set -as terminal-features 'xterm-kitty:RGB'
set -as terminal-features 'xterm-kitty:extkeys'

bind C {
    splitw -f -l30% ''
    set-hook -p pane-mode-changed 'if -F "#{!=:#{pane_mode},copy-mode}" "kill-pane"'
    copy-mode -s'{last}'
}
